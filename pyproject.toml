[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Note: "murmur" is already taken on PyPI (v0.1.3). Using "murmur-dictation" instead.
name = "murmur-dictation"
version = "0.1.0"
description = "System-wide voice dictation for Linux and macOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Leon Sixt", email = "leon@berleon.eu"},
]
keywords = ["voice", "dictation", "speech-to-text", "accessibility", "transcription"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "assemblyai>=0.33.0",
    "customtkinter>=5.2.0",
    "evdev>=1.7.0; sys_platform == 'linux'",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "PyGObject>=3.42.0; sys_platform == 'linux'",
    "sounddevice>=0.5.5",
    "pynput>=1.7.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=9.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=9.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/berleon/murmur"
Repository = "https://github.com/berleon/murmur"
Issues = "https://github.com/berleon/murmur/issues"

[project.scripts]
# Note: entry point uses "murmur-dictation" to match the PyPI package name.
# The installed command is still "murmur" for UX consistency.
murmur = "murmur.main:main"

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "ruff>=0.9.0",
    "pytest>=8.1.0",
    "pytest-mock>=3.14.0",
    "pre-commit>=4.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["murmur"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.planning",
    "/tests",
    "*.sh",
    "*.service",
    "*.plist",
    "/packaging",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"
reportMissingTypeStubs = "none"
reportPrivateUsage = "none"
reportUntypedFunctionDecorator = "none"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length enforced by formatter, not linter

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: marks tests that require real hardware (evdev device, ydotoold daemon)",
    "requires_virtual_mic: marks tests that require a virtual mic device (snd-aloop or BlackHole)",
    "linux_only: marks tests that only run on Linux",
    "macos_only: marks tests that only run on macOS",
]
